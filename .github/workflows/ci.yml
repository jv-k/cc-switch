name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=bash cc-switch.sh bin/cc-switch install.sh \
            prompt/statusline.sh tests/run.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install jq
        run: command -v jq || (sudo apt-get update -qq && sudo apt-get install -y -qq jq)
      - name: bash
        run: bash tests/run.sh
      - name: zsh
        run: |
          command -v zsh || (sudo apt-get install -y -qq zsh)
          zsh -c 'source ./cc-switch.sh && cc --help' >/dev/null
